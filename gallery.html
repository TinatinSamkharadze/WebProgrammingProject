<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://kit.fontawesome.com/7d58f8bf40.js" crossorigin="anonymous"></script>
    <title>Sweet Bakery - Gallery</title>
</head>

<body>
    <header class="header">
        <nav class="header__nav header__container">
            <a href="index.html" class="header__logo">
                <h1 class="header__logo-text">🍰 Sweet Bakery</h1>
            </a>
            <ul class="header__nav-list">
                <li><button class="header__nav-btn" id="btn-close">
                        <i class="fa-solid fa-square-xmark"></i>
                    </button></li>
                <li class="header__nav-item">
                    <a href="index.html" class="header__nav-link">Home</a>
                </li>
                <li class="header__nav-item">
                    <a href="About.html" class="header__nav-link">About</a>
                </li>
                <li class="header__nav-item">
                    <a href="Menu.html" class="header__nav-link">Menu</a>
                </li>
                <li class="header__nav-item">
                    <a href="Feedback.html" class="header__nav-link">Feedback</a>
                </li>
                <li class="header__nav-item">
                    <a href="Gallery.html" class="header__nav-link">Gallery</a>
                </li>
                <li class="header__nav-item">
                    <a href="Contact.html" class="header__nav-link">Contact</a>
                </li>
            </ul>
            <button class="header__nav-btn" id="btn-open">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>
    </header>

    <main>
        <div class="gallery">
            <h2 class="gallery__title">Gallery - Our Sweet Creations</h2>
            <div class="gallery__container">
                <ul class="gallery__container-list">
                    <li class="gallery__container-item">
                        <img src="images/gallery-1.png" alt="Fresh pastries display" class="gallery__container-img" />
                    </li>

                    <li class="gallery__container-item">
                        <img src="images/gallery-2.jpg" alt="Delicious cakes and desserts"
                            class="gallery__container-img" />
                    </li>

                    <li class="gallery__container-item">
                        <img src="images/gallery-3.jpg" alt="Artisan bread selection" class="gallery__container-img" />
                    </li>

                    <li class="gallery__container-item">
                        <img src="images/gallery-4.jpg" alt="Colorful macarons and treats"
                            class="gallery__container-img" />
                    </li>

                    <li class="gallery__container-item">
                        <img src="images/gallery-5.jpg" alt="Custom bakery creations" class="gallery__container-img" />
                    </li>

                    <li class="gallery__container-item">
                        <img src="images/gallery-6.jpg" alt="Chocolate masterpieces" class="gallery__container-img" />
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <script src="js/menu.js"></script>
</body>

</html>
